const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(clave){
  const d=b64(PAQUETE), salt=d.slice(0,16), iv=d.slice(16,28), dato=d.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const claro=await crypto.subtle.decrypt({name:"AES-GCM",iv},k,dato);
  return new TextDecoder().decode(claro);
}
async function intentar(clave,guardar){
  const err=document.getElementById("err"), btn=document.getElementById("abrir");
  err.textContent=""; btn.disabled=true; btn.textContent="Abriendo...";
  try{
    const html=await abrir(clave);
    if(guardar){ try{localStorage.setItem("rj-clave",clave)}catch(e){} }
    document.open(); document.write("<!doctype html><html lang=es><head>"+html+"</html>"); document.close();
  }catch(e){
    try{localStorage.removeItem("rj-clave")}catch(_){}
    err.textContent="Esa contrase&ntilde;a no es."; btn.disabled=false; btn.textContent="Abrir";
    document.getElementById("clave").select();
  }
}
document.getElementById("abrir").onclick=()=>intentar(document.getElementById("clave").value,true);
document.getElementById("clave").onkeydown=e=>{if(e.key==="Enter")document.getElementById("abrir").click()};
try{const g=localStorage.getItem("rj-clave"); if(g) intentar(g,false);}catch(e){}
